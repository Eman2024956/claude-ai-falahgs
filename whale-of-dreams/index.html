<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Whale of Dreams — Creative Studio</title>
  <meta name="description" content="Whale of Dreams is a creative studio that turns ambitious ideas into extraordinary brands and digital experiences." />
  <meta name="theme-color" content="#f3a9d4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="preload" href="assets/whale.glb" as="fetch" crossorigin />
  <link rel="stylesheet" href="src/styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <section class="hero is-loading" id="hero" aria-label="Whale of Dreams — Dream Big">
    <!-- still fallback (no WebGL / before first frame) -->
    <div class="hero__still" aria-hidden="true"></div>
    <canvas class="hero__canvas" id="scene" aria-hidden="true"></canvas>

    <header class="hero__header">
      <a class="brand" href="#" aria-label="Whale of Dreams home">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 18c3.5-6 10-9 17-7.5 3 .7 5 2.2 6.5 4.2l2.5-3.2.6 6.8-5.3-1.2c-1.4 3.2-5 5.9-10.3 5.9C8.6 23 5 21 3 18Z" fill="currentColor"/>
          <circle cx="9" cy="16.3" r="1" fill="#f6b3d6"/>
          <circle cx="15" cy="9.4" r="1.8" fill="#ff8fc0"/><circle cx="18.6" cy="9.8" r="1.4" fill="#ffd3e6"/>
        </svg>
        <span>Whale of Dreams</span>
      </a>
      <a class="btn btn--ghost" href="#contact">Let’s Dream<span class="btn__arrow" aria-hidden="true">→</span></a>
    </header>

    <!-- The headline is drawn inside the 3D composite so the whale can swim in front of it.
         This real heading stays for assistive tech, SEO and the no-WebGL fallback. -->
    <h1 class="hero__title" id="title">Dream Big</h1>

    <div class="hero__copy">
      <p class="hero__line">Big ideas deserve extraordinary worlds.</p>
      <a class="btn btn--solid" href="#work">Explore Our Work<span class="btn__arrow" aria-hidden="true">→</span></a>
    </div>

    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="loader__inner">
        <span class="loader__name">Whale of Dreams</span>
        <span class="loader__bar"><i id="loaderBar"></i></span>
        <span class="loader__label" id="loaderLabel">Gathering clouds…</span>
      </div>
    </div>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
