# /etc/nginx/sites-available/whatsapp-sender   (then: ln -s ../sites-available/whatsapp-sender /etc/nginx/sites-enabled/)
# HTTPS certificate: sudo certbot --nginx -d wa.example.com
server {
    listen 80;
    server_name wa.example.com;

    client_max_body_size 30m;            # media uploads (MCP mode)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;             # live send progress (streamed)
        proxy_read_timeout 3600s;        # long bulk sends
    }
}
